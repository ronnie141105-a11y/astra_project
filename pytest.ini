[pytest]
# ---------------------------------------------------------------------------
# ASTRA pytest configuration.
#
# The repo also ships tests/_runner.py-based scripts (tests/test_*.py
# predating this scaffold), each with its own `main()` and
# `if __name__ == "__main__":` guard. Those remain runnable directly
# (`python3 tests/test_interface.py`) and are ALSO discovered by pytest
# below (pytest simply imports the module and collects nothing if there
# are no `test_*` functions/classes pytest recognizes at module scope --
# but several of these files define top-level `test_*` functions taking
# a `Runner` fixture-shaped argument `r`, which pytest cannot satisfy).
# To avoid pytest erroring on those legacy files, new pytest-native tests
# live under tests/pytest/ and that is what's collected by default; the
# legacy scripts remain excluded from default collection but can still
# be run standalone.
# ---------------------------------------------------------------------------
minversion = 8.0
testpaths = tests/pytest
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Legacy Runner-style scripts (tests/test_*.py at the top level) are not
# pytest-native; keep them out of default collection.
norecursedirs = .git .venv venv build dist

asyncio_mode = auto

addopts =
    -ra
    --strict-markers
    --strict-config

markers =
    asyncio: mark a test as asyncio-based (handled by pytest-asyncio in auto mode)
    integration: slower tests that spin up a full AsyncPipeline / WebSocket server
